name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: orblit-net

      # The engine is a separate private repository, so CI checks it out and
      # points this package at it rather than resolving a git dependency it
      # has no credentials for. This step is the visible cost of the split;
      # a monorepo would not need it.
      - uses: actions/checkout@v4
        with:
          # No token: these repositories are public, so the default
          # GITHUB_TOKEN reads them. Nothing here needs a secret.
          repository: ChxisB/orblit
          path: orblit

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned: a formatter that moves under the repository turns an
          # unrelated SDK release into a red build.
          sdk: 3.13.0

      - name: Link the engine
        working-directory: orblit-net
        run: ./tool/link_local.sh ../orblit

      - name: Check
        working-directory: orblit-net
        run: ./tool/check.sh

  # Checks each commit on a pull request against commitlint.config.mjs.
  # Pull requests only, since a push to main has no range to check. It
  # checks out the branch head, not the merge commit GitHub makes, so the
  # range holds the branch's own commits and nothing else.
  commits:
    name: Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli@21 --from "origin/$BASE_BRANCH" --to HEAD
        env:
          BASE_BRANCH: ${{ github.base_ref }}

name: orblit_net
description: >-
  Multiplayer for Orblit. Replicates component columns rather than object
  properties, with ownership rules, interpolation and its own transports.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orblit_core:
    git:
      url: https://github.com/ChxisB/orblit.git
      path: packages/orblit_core
      ref: main

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
